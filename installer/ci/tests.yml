# Runnable-test gate for every push and pull request.
#
# Policy (§10): a release verdict of PASS requires green runnable tests. This
# workflow runs the full backend suite on ubuntu-latest so every PR shows a
# real signal; anything it cannot verify (Windows EXE, on-device APK, physical
# hardware) is NOT faked here — those stay MANUAL_ACCEPTANCE_REQUIRED in the
# release audit.
#
# Stored in installer/ci/ (not .github/workflows/) because the maintenance
# token lacks the `workflows` scope — see README.md in this folder. Activate
# with scripts/activate-ci.sh from a machine with the `workflow` scope.
name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run the full backend suite
        working-directory: backend
        run: python -m pytest tests/ -q
