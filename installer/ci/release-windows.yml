# Build the real Windows installer on real Windows hardware.
#
# The development sandbox is Linux, so it cannot produce (or honestly test) a
# Windows .exe: PyInstaller does not cross-compile and Inno Setup is a Windows
# tool. Rather than ship something unverified, the Setup.exe is built here on a
# windows-latest runner and attached to the GitHub Release.
#
# Trigger: pushing a v* tag, or manually from the Actions tab.
name: Build and publish release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the installer to (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Sanity-check the app imports before packaging
        working-directory: backend
        run: python -c "import app.main; import app; print('version', app.__version__)"

      - name: Run the test suite
        working-directory: backend
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Build the executable (PyInstaller)
        working-directory: installer/windows
        run: pyinstaller --clean --noconfirm app.spec

      - name: Smoke-test the frozen executable
        shell: pwsh
        run: |
          $exe = "installer/windows/dist/SupermarketSystem.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no exe" }
          $env:NO_BROWSER = "1"
          $p = Start-Process -FilePath $exe -PassThru
          # The launcher picks a free port and logs it; poll the user data dir.
          $log = Join-Path $env:USERPROFILE "SupermarketSystem\logs\supermarket.log"
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern "starting at http://127.0.0.1:(\d+)" |
                   Select-Object -Last 1
              if ($m) {
                $port = $m.Matches[0].Groups[1].Value
                try {
                  $r = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5
                  if ($r.StatusCode -eq 200) { $ok = $true; break }
                } catch { }
              }
            }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            if (Test-Path $log) { Get-Content $log -Tail 50 }
            throw "frozen executable did not serve the panel"
          }
          Write-Host "frozen executable booted and served the panel"

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup ships preinstalled on windows-latest images; install if absent.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc installer\windows\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Locate and checksum the Setup.exe
        id: artifact
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Recurse -Filter "SupermarketSystem-Setup-*.exe" |
                   Select-Object -First 1
          if (-not $setup) { throw "no Setup.exe produced" }
          Write-Host "built: $($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MB)"
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash |
            Out-File "$($setup.FullName).sha256" -Encoding ascii
          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256

      - name: Attach to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "push") {
            "${{ github.ref_name }}"
          } else { "${{ inputs.tag }}" }
          gh release upload $tag "${{ steps.artifact.outputs.path }}" `
            "${{ steps.artifact.outputs.path }}.sha256" --clobber

  # The development sandbox can build this tarball but cannot upload it:
  # uploads.github.com is outside its egress allowlist. Building it here keeps
  # the Linux artifact reproducible and attached by the same trusted job.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt cx_Freeze

      - name: Run the test suite
        working-directory: backend
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Build the frozen application
        working-directory: installer/standalone
        run: python setup.py build

      - name: Boot the frozen build and verify it serves the panel
        shell: bash
        run: |
          cd installer/standalone/build/exe.linux-*
          export HOME=$(mktemp -d)
          NO_BROWSER=1 ./SupermarketSystem > /tmp/boot.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 2
            port=$(grep -oP 'http://127.0.0.1:\K[0-9]+' /tmp/boot.log | head -1) || true
            if [ -n "$port" ] && curl -sf "http://127.0.0.1:$port/" > /dev/null; then
              echo "frozen build serves the panel on :$port"
              # migrations must run inside the frozen app, not be skipped
              grep -q "Alembic sync skipped" /tmp/boot.log \
                && { echo "ERROR: migrations were skipped"; exit 1; }
              curl -sf -o /dev/null -w '/m -> %{http_code}\n' "http://127.0.0.1:$port/m"
              exit 0
            fi
          done
          tail -50 /tmp/boot.log; exit 1

      - name: Package and checksum
        run: |
          cd installer/standalone/build
          tar -czf "$GITHUB_WORKSPACE/SupermarketSystem-0.2.0-linux-x86_64.tar.gz" exe.linux-*
          cd "$GITHUB_WORKSPACE"
          sha256sum SupermarketSystem-0.2.0-linux-x86_64.tar.gz > SHA256SUMS-linux.txt

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          gh release upload "$tag" \
            SupermarketSystem-0.2.0-linux-x86_64.tar.gz \
            SHA256SUMS-linux.txt --clobber
