# Build the Android APK (§257) on GitHub Actions and attach it to the release.
# Activate with scripts/activate-ci.sh (moves this file into .github/workflows).
name: Build Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the APK to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: mobile-android
        run: gradle assembleRelease --no-daemon

      - name: Name and checksum the APK
        id: apk
        run: |
          v=$(sed -nE 's/__version__\s*=\s*"([^"]+)"/\1/p' backend/app/__init__.py)
          src=$(ls mobile-android/app/build/outputs/apk/release/*.apk | head -1)
          out="SupermarketMobile-$v.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -z "$tag" ] && tag="${GITHUB_REF_NAME}"
          gh release upload "$tag" "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.path }}.sha256" --clobber
