<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سیستم مدیریت سوپرمارکت</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#0f1420" />
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="card login-card">
      <img class="login-logo" src="/icons/logo.svg" alt="لوگوی سامانه" />
      <h1>سیستم مدیریت سوپرمارکت</h1>
      <p class="muted">مدیریت کالا · انبارداری هوشمند · صندوق فروشگاهی</p>
      <label>نام کاربری</label>
      <input id="login-username" autocomplete="username" autofocus />
      <label>رمز عبور</label>
      <input id="login-password" type="password" autocomplete="current-password" />
      <button type="submit" class="btn btn-primary btn-block">ورود</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/icons/logo.svg" alt="لوگو" />
        <span>سوپرمارکت</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div id="whoami" class="muted"></div>
        <button id="logout" class="btn btn-ghost btn-block">خروج</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 id="view-title"></h2>
        <div id="topbar-actions"></div>
      </header>
      <section id="view" class="view"></section>
      <!-- Status bar (§21): network, date/time, and live system state -->
      <footer id="statusbar" class="statusbar">
        <span class="sb-item"><i id="sb-net-dot" class="sb-dot"></i><span id="sb-net">—</span></span>
        <span class="sb-sep"></span>
        <span class="sb-item" id="sb-date">—</span>
        <span class="sb-item sb-clock" id="sb-clock">—:—</span>
        <span class="sb-grow"></span>
        <span class="sb-item" id="sb-store"></span>
        <span class="sb-item" id="sb-user"></span>
        <span class="sb-item" id="sb-db" title="وضعیت پایگاه‌داده">DB</span>
        <span class="sb-item" id="sb-printer" title="وضعیت چاپگر">🖨</span>
        <button class="sb-theme" id="sb-theme" title="تغییر پوسته">◐</button>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal-overlay hidden"></div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
