<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سیستم مدیریت سوپرمارکت</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#0f1420" />
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="card login-card">
      <h1>🛒 سیستم مدیریت سوپرمارکت</h1>
      <p class="muted">مدیریت کالا · انبارداری هوشمند · صندوق فروشگاهی</p>
      <label>نام کاربری</label>
      <input id="login-username" autocomplete="username" autofocus />
      <label>رمز عبور</label>
      <input id="login-password" type="password" autocomplete="current-password" />
      <button type="submit" class="btn btn-primary btn-block">ورود</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand">🛒 <span>سوپرمارکت</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div id="whoami" class="muted"></div>
        <button id="logout" class="btn btn-ghost btn-block">خروج</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 id="view-title"></h2>
        <div id="topbar-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal-overlay hidden"></div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
